<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에이콘 도서 — 에이콘출판사</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── 토큰 ── */
:root{
  --paper:#F5EEE1; --paper-deep:#EBE1CD; --paper-light:#FBF6EC;
  --ink:#1C2028; --ink-soft:#3A3D45; --ink-mute:#6B6B68;
  --rule:#D6CDBF; --rule-soft:#E4DECE;
  --burgundy:#7A1F2B; --burgundy-deep:#5A1520;
  --gold:#B89B54; --gold-soft:#D4BE85;
  --forest:#2D4A3A; --forest-lt:#3D6B50;
  --ocean:#1A6FA8;
  --serif:'Noto Serif KR',serif;
  --sans:'Pretendard',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --display:'Fraunces',serif;
  --radius:10px;
  --shadow:0 4px 20px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:var(--sans)}

/* ── 공통 ── */
.page{display:none} .page.on{display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ══════════════════════════
   HEADER
══════════════════════════ */
.hd{background:var(--burgundy-deep);position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.28)}
.hd-inner{max-width:1140px;margin:0 auto;padding:0 32px;height:58px;display:flex;align-items:center;gap:20px}
.hd-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.hd-mark{width:32px;height:32px;background:var(--gold);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--burgundy-deep)}
.hd-name{font-family:var(--serif);font-size:15px;font-weight:700;color:#fff}
.hd-search{flex:1;max-width:400px;position:relative}
.hd-search input{width:100%;padding:8px 14px 8px 38px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:7px;font-size:13px;color:#fff;outline:none;transition:background .15s}
.hd-search input::placeholder{color:rgba(255,255,255,.4)}
.hd-search input:focus{background:rgba(255,255,255,.18)}
.hd-search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.hd-nav{display:flex;gap:4px;margin-left:auto}
.hd-nav-btn{padding:7px 14px;border-radius:6px;font-size:12.5px;color:rgba(255,255,255,.7);background:none;border:none;transition:all .15s}
.hd-nav-btn:hover,.hd-nav-btn.on{background:rgba(255,255,255,.1);color:#fff}
.hd-cart{position:relative}
.hd-login-btn{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:100px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);text-decoration:none;color:rgba(255,255,255,.85);font-size:12.5px;font-weight:500;transition:all .18s;margin-left:4px;cursor:pointer}
.hd-login-btn:hover{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)}
.hd-login-avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--burgundy-deep);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0}
.hd-login-label{letter-spacing:.02em}
.cart-badge{position:absolute;top:-4px;right:-4px;width:17px;height:17px;background:var(--gold);border-radius:50%;font-size:9px;font-weight:700;color:var(--burgundy-deep);display:flex;align-items:center;justify-content:center;font-family:var(--mono)}

/* ══════════════════════════
   카테고리 바
══════════════════════════ */
.cat-bar{background:var(--paper-deep);border-bottom:1px solid var(--rule)}
.cat-inner{max-width:1140px;margin:0 auto;padding:0 32px;display:flex;gap:0;overflow-x:auto}
.cat-btn{padding:11px 18px;font-size:12.5px;font-weight:500;color:var(--ink-mute);white-space:nowrap;background:none;border:none;border-bottom:2.5px solid transparent;transition:all .15s}
.cat-btn:hover{color:var(--ink)}
.cat-btn.on{color:var(--burgundy);border-bottom-color:var(--burgundy);font-weight:700}

/* ══════════════════════════
   도서 목록 페이지
══════════════════════════ */
.list-wrap{max-width:1140px;margin:0 auto;padding:32px 32px 60px;display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
/* 사이드 필터 */
.filter-panel{background:var(--paper-light);border:1px solid var(--rule);border-radius:var(--radius);padding:20px;position:sticky;top:74px}
.fp-title{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.fp-group{margin-bottom:18px}
.fp-group-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:8px}
.fp-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--ink-soft);cursor:pointer;transition:color .12s}
.fp-item:hover{color:var(--burgundy)}
.fp-item input[type=checkbox]{accent-color:var(--burgundy);width:13px;height:13px;cursor:pointer}
.fp-item.on{color:var(--burgundy);font-weight:600}
/* 도서 그리드 */
.books-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.books-count{font-size:12.5px;color:var(--ink-mute);font-family:var(--mono)}
.sort-sel{padding:6px 12px;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;background:var(--paper-light);color:var(--ink);cursor:pointer;outline:none}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
/* 도서 카드 */
.bk-card{background:var(--paper-light);border:1.5px solid var(--rule);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.bk-card:hover{border-color:rgba(122,31,43,.35);box-shadow:var(--shadow);transform:translateY(-2px)}
.bk-cover{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.bk-format-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:3px}
.fmt-b{font-size:9.5px;padding:2px 6px;border-radius:3px;font-family:var(--mono);font-weight:600}
.fmt-b.paper{background:rgba(29,158,117,.85);color:#fff}
.fmt-b.ebook{background:rgba(26,143,184,.85);color:#fff}
.fmt-b.audio{background:rgba(184,132,60,.85);color:#fff}
.fmt-b.lecture{background:rgba(122,31,43,.85);color:#fff}
.fmt-b.epub{background:rgba(80,50,160,.85);color:#fff}
.bk-body{padding:12px 13px 14px}
.bk-cat{font-size:10px;color:var(--burgundy);font-family:var(--mono);font-weight:600;letter-spacing:.05em;margin-bottom:4px}
.bk-title{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk-author{font-size:11.5px;color:var(--ink-mute);margin-bottom:8px}
.bk-price{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink)}
.bk-price-sub{font-size:10.5px;color:var(--ink-mute);margin-top:2px}

/* ══════════════════════════
   도서 상세 페이지
══════════════════════════ */
.detail-wrap{max-width:1100px;margin:0 auto;padding:32px 32px 60px}
/* 브레드크럼 */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-mute);margin-bottom:24px}
.breadcrumb span{cursor:pointer;transition:color .12s}.breadcrumb span:hover{color:var(--burgundy)}
.breadcrumb-sep{opacity:.4}
/* 상단 도서 정보 */
.detail-top{display:grid;grid-template-columns:220px 1fr;gap:32px;margin-bottom:36px;align-items:start}
.cover-3d{width:100%;aspect-ratio:3/4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:4px 8px 32px rgba(0,0,0,.22),inset -2px 0 6px rgba(0,0,0,.1);position:relative}
.detail-meta{padding-top:4px}
.detail-cat{font-size:10.5px;color:var(--burgundy);font-family:var(--mono);font-weight:600;letter-spacing:.08em;margin-bottom:8px}
.detail-title{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:6px}
.detail-author-row{font-size:13px;color:var(--ink-mute);margin-bottom:14px}
.detail-author-row b{color:var(--ink);font-weight:600}
.detail-rating{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.stars{color:var(--gold);font-size:14px;letter-spacing:.05em}
.rating-num{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.rating-cnt{font-size:11.5px;color:var(--ink-mute)}
/* 구매 박스 */
.buy-box{background:var(--paper-light);border:1.5px solid var(--rule);border-radius:10px;padding:20px 22px;margin-bottom:18px}
.buy-box-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:14px}
.format-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.fmt-tab{padding:7px 15px;border:1.5px solid var(--rule);border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-mute);background:var(--paper);transition:all .15s}
.fmt-tab:hover{border-color:var(--burgundy);color:var(--burgundy)}
.fmt-tab.on{border-color:var(--burgundy);background:rgba(122,31,43,.07);color:var(--burgundy)}
.fmt-tab.disabled{opacity:.38;pointer-events:none}
.fmt-tab .fmt-ico{margin-right:5px}
.price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.price-main{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink)}
.price-orig{font-size:14px;color:var(--ink-mute);text-decoration:line-through}
.price-dc{font-size:13px;color:#C0392B;font-weight:600}
.price-desc{font-size:11.5px;color:var(--ink-mute);margin-bottom:16px;line-height:1.6}
.qty-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qty-lbl{font-size:12.5px;color:var(--ink-mute)}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1.5px solid var(--rule);border-radius:7px;overflow:hidden}
.qty-btn{width:34px;height:34px;background:var(--paper-deep);border:none;font-size:16px;color:var(--ink);transition:background .12s}
.qty-btn:hover{background:var(--rule)}
.qty-val{width:44px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:600;border:none;background:var(--paper-light);color:var(--ink);outline:none}
.btn-buy-row{display:flex;gap:9px}
.btn-cart{flex:1;padding:12px;background:var(--paper-deep);border:1.5px solid var(--rule);border-radius:7px;font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink);transition:all .15s}
.btn-cart:hover{border-color:var(--burgundy);color:var(--burgundy);background:rgba(122,31,43,.05)}
.btn-buy{flex:2;padding:12px;background:var(--burgundy);border:none;border-radius:7px;font-family:var(--serif);font-size:14px;font-weight:700;color:#fff;transition:opacity .15s}
.btn-buy:hover{opacity:.88}
.external-channels{margin-top:14px;border-top:1px solid var(--rule);padding-top:14px}
.ext-title{font-size:11px;color:var(--ink-mute);margin-bottom:9px;font-weight:600}
.ext-links{display:flex;gap:7px;flex-wrap:wrap}
.ext-link{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--rule);border-radius:6px;font-size:11.5px;color:var(--ink-soft);background:var(--paper);transition:border-color .12s}
.ext-link:hover{border-color:var(--burgundy);color:var(--burgundy)}
/* 상세 탭 */
.detail-tabs{display:flex;gap:0;border-bottom:2px solid var(--rule);margin-bottom:28px;overflow-x:auto}
.dtab{padding:11px 22px;font-family:var(--serif);font-size:13.5px;font-weight:600;color:var(--ink-mute);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s}
.dtab:hover{color:var(--ink)}
.dtab.on{color:var(--burgundy);border-bottom-color:var(--burgundy)}
.dtab-panel{display:none}.dtab-panel.on{display:block}
/* 도서 소개 */
.intro-body{font-size:14px;color:var(--ink-soft);line-height:1.85;max-width:780px}
.intro-body h3{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 10px}
.intro-body p{margin-bottom:12px}
.intro-body ul{padding-left:20px;margin-bottom:12px}
.intro-body ul li{margin-bottom:5px}
/* 저역자 소개 */
.author-card{display:flex;gap:20px;padding:20px;background:var(--paper-light);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:14px}
.author-avatar{width:72px;height:72px;border-radius:50%;background:var(--burgundy);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:24px;font-weight:700;color:#fff;flex-shrink:0}
.author-name{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px}
.author-role{font-size:11px;color:var(--burgundy);font-family:var(--mono);margin-bottom:8px}
.author-bio{font-size:13px;color:var(--ink-soft);line-height:1.7}
/* 목차 */
.toc-part{margin-bottom:20px}
.toc-part-title{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink);padding:10px 14px;background:var(--paper-deep);border-radius:7px;margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer}
.toc-items{padding:0 4px;display:flex;flex-direction:column;gap:0}
.toc-item{display:flex;gap:12px;padding:7px 12px;font-size:13px;color:var(--ink-soft);border-radius:5px;transition:background .1s}
.toc-item:hover{background:var(--paper-deep)}
.toc-ch{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);min-width:40px;flex-shrink:0;padding-top:2px}
.toc-pg{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);margin-left:auto;flex-shrink:0;padding-top:2px}
/* 소개 영상 */
.video-hero{aspect-ratio:16/9;background:linear-gradient(135deg,#10130d,#1a2a14);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1.5px solid rgba(29,158,117,.2);cursor:pointer;transition:border-color .15s;margin-bottom:16px}
.video-hero:hover{border-color:rgba(29,158,117,.5)}
.vplay{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:26px;transition:background .15s}
.video-hero:hover .vplay{background:rgba(255,255,255,.22)}
.vmeta{font-family:var(--mono);font-size:12px;color:rgba(246,241,230,.5)}
.video-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vcard{display:flex;gap:12px;padding:13px 15px;background:var(--paper-light);border:1px solid var(--rule);border-radius:8px;cursor:pointer;transition:border-color .15s}
.vcard:hover{border-color:rgba(122,31,43,.3)}
.vcard-thumb{width:80px;height:54px;background:linear-gradient(135deg,#1a2a14,#2a1a14);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.vcard-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px}
.vcard-meta{font-size:11px;color:var(--ink-mute);font-family:var(--mono)}
/* 오류 신고 */
.err-form{background:var(--paper-light);border:1.5px solid var(--rule);border-radius:var(--radius);padding:22px 24px;margin-bottom:24px}
.form-title{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-input{width:100%;padding:9px 13px;border:1.5px solid var(--rule);border-radius:7px;font-family:var(--sans);font-size:13px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--burgundy)}
.form-textarea{width:100%;min-height:90px;padding:9px 13px;border:1.5px solid var(--rule);border-radius:7px;font-family:var(--sans);font-size:13px;background:var(--paper);color:var(--ink);outline:none;resize:vertical;transition:border-color .15s}
.form-textarea:focus{border-color:var(--burgundy)}
.form-submit{padding:10px 24px;background:var(--burgundy);color:#fff;border:none;border-radius:7px;font-family:var(--serif);font-size:13px;font-weight:700;transition:opacity .15s}
.form-submit:hover{opacity:.86}
.err-list{display:flex;flex-direction:column;gap:8px}
.err-item{display:flex;gap:10px;padding:12px 14px;background:var(--paper-light);border:1px solid var(--rule);border-radius:8px;align-items:flex-start}
.err-type-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-family:var(--mono);font-weight:600;flex-shrink:0;margin-top:2px}
.err-type-badge.fix{background:rgba(192,57,43,.08);color:#C0392B}
.err-type-badge.note{background:rgba(26,143,184,.08);color:var(--ocean)}
/* 독자 문의 */
.qa-item{padding:16px 18px;background:var(--paper-light);border:1px solid var(--rule);border-radius:9px;margin-bottom:10px}
.qa-q{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:8px;display:flex;gap:8px}
.qa-q::before{content:'Q';font-family:var(--mono);font-size:11px;font-weight:700;color:var(--burgundy);background:rgba(122,31,43,.09);padding:2px 7px;border-radius:3px;flex-shrink:0;margin-top:2px}
.qa-a{font-size:13px;color:var(--ink-soft);line-height:1.75;display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--rule-soft);margin-top:8px}
.qa-a::before{content:'A';font-family:var(--mono);font-size:11px;font-weight:700;color:var(--forest);background:rgba(45,74,58,.09);padding:2px 7px;border-radius:3px;flex-shrink:0;margin-top:2px}
.qa-meta{font-size:10.5px;color:var(--ink-mute);font-family:var(--mono);margin-top:8px;text-align:right}

/* ══════════════════════════
   장바구니 드로어
══════════════════════════ */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;opacity:0;pointer-events:none;transition:opacity .22s}
.cart-overlay.on{opacity:1;pointer-events:all}
.cart-drawer{position:fixed;right:-420px;top:0;width:420px;height:100vh;background:var(--paper-light);border-left:1px solid var(--rule);z-index:401;overflow-y:auto;transition:right .25s;display:flex;flex-direction:column}
.cart-drawer.on{right:0}
.cart-hd{padding:20px 24px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cart-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
.cart-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--paper-deep);font-size:16px;color:var(--ink);transition:background .12s}
.cart-close:hover{background:var(--rule)}
.cart-body{flex:1;padding:16px 24px;overflow-y:auto}
.cart-empty{text-align:center;padding:48px 0;color:var(--ink-mute);font-size:13.5px}
.cart-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.ci-cover{width:52px;height:68px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ci-title{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px;line-height:1.4}
.ci-fmt{font-size:10.5px;color:var(--burgundy);font-family:var(--mono);font-weight:600}
.ci-price{font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--ink);margin-top:6px}
.ci-remove{margin-left:auto;font-size:13px;color:var(--ink-mute);background:none;border:none;padding:4px;align-self:flex-start;transition:color .12s;flex-shrink:0}
.ci-remove:hover{color:var(--burgundy)}
.cart-ft{padding:16px 24px 24px;border-top:1px solid var(--rule);flex-shrink:0}

   ACORN Shared Data Layer v1.0
   localStorage 공유 스키마:
     ACORN_USER            독자 로그인 세션 {id, name, email}
     ACORN_BOOKS           관리자 등록 도서 목록 (BM_BOOKS sync)
     ACORN_CART            장바구니 [{bookId, fmt, price, qty}]
     ACORN_ORDERS          구매 이력 [{orderId, date, items, total}]
     ACORN_LIBRARY         디지털 서재 [{bookId, format, ...}]
     ACORN_AUTHOR_SESSION  저자 포털 세션 {email, name, ...}
     adm_mr_{ch}           관리자 채널 상태 (Admin→Author)
═══════════════════════════════════════════════════════════ */
var ACORN_DB = (function(){
  function _g(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function _s(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function _rm(k){ try{ localStorage.removeItem(k); }catch(e){} }
  var db = {
    getUser:         function(){ return _g('ACORN_USER'); },
    setUser:         function(u){ _s('ACORN_USER', u); },
    logoutUser:      function(){ _rm('ACORN_USER'); },
    isLoggedIn:      function(){ return !!_g('ACORN_USER'); },
    getBooks:        function(){ return _g('ACORN_BOOKS') || []; },
    setBooks:        function(b){ _s('ACORN_BOOKS', b); },
    getCart:         function(){ return _g('ACORN_CART') || []; },
    setCart:         function(c){ _s('ACORN_CART', c); },
    clearCart:       function(){ _rm('ACORN_CART'); },
    getOrders:       function(){ return _g('ACORN_ORDERS') || []; },
    addOrder:        function(o){ var a=this.getOrders(); a.unshift(o); _s('ACORN_ORDERS', a); },
    getLibrary:      function(){ return _g('ACORN_LIBRARY') || []; },
    addToLibrary:    function(item){
      var lib = this.getLibrary();
      if(!lib.find(function(b){ return b.bookId===item.bookId && b.format===item.format; })){
        lib.unshift(item); _s('ACORN_LIBRARY', lib);
      }
    },
    getAuthorSession:function(){ return _g('ACORN_AUTHOR_SESSION'); },
    setAuthorSession:function(a){ _s('ACORN_AUTHOR_SESSION', a); },
    logoutAuthor:    function(){ _rm('ACORN_AUTHOR_SESSION'); },
    getMrChannel:    function(ch){ return _g('adm_mr_'+ch) || {status:'',note:'',statusLabel:''}; },
  };
  return db;
})();

      ACORN_DB.addToLibrary({ bookId:item.bookId, format:item.format, title:item.title,
        coverColor:item.coverColor, coverEmoji:item.coverEmoji, cat:item.cat, authors:item.authors,
        purchasedAt:ds, progress:0, orderId:orderId });
    }
  });
  state.cart = []; ACORN_DB.clearCart(); updateCartBadge();
  document.getElementById('cart-overlay').classList.remove('on');
  document.getElementById('cart-drawer').classList.remove('on');
  toast('\u2713 결제 완료! \u20A9' + total.toLocaleString() + ' · 주문번호 ' + orderId);
  setTimeout(function(){
    if(confirm('\u2713 결제가 완료되었습니다!\n\u20A9' + total.toLocaleString() + '\n\n내 서재(MyPage)에서 구매 도서를 확인하시겠습니까?')){
      window.location.href = 'mypage.html';
    }
  }, 300);
}
function changeQty(d){
  var el = document.getElementById('qty-val');
  el.value = Math.max(1, parseInt(el.value||1)+d);
}

/* ══════ LIST ══════ */
var currentBooks = [];
function showList(){
  document.getElementById('page-list').classList.add('on');
  document.getElementById('page-detail').classList.remove('on');
  document.getElementById('cat-bar').style.display = '';
  renderBookGrid(currentBooks);
}
function filterCat(cat, btn){
  state.currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  applyFilters();
}
function onSearch(q){
  var lq = q.toLowerCase();
  var filtered = BOOKS.filter(function(b){
    return b.title.toLowerCase().includes(lq)
      || b.authors.map(function(a){return a.name;}).join(' ').toLowerCase().includes(lq)
      || b.cat.toLowerCase().includes(lq);
  });
  renderBookGrid(filtered);
}
function applyFilters(){
  var fmts = Array.from(document.querySelectorAll('.fp-item input[type=checkbox]:checked')).map(function(c){return c.value;});
  var books = BOOKS.filter(function(b){
    if (state.currentCat !== 'all' && b.cat !== state.currentCat) return false;
    if (fmts.some(function(f){return ['paper','ebook','epub','audio','lecture'].includes(f);})){
      if (!fmts.some(function(f){return b.formats.includes(f);})) return false;
    }
    return true;
  });
  currentBooks = books;
  renderBookGrid(books);
}
function sortBooks(mode){
  var sorted = currentBooks.slice();
  if (mode==='popular') sorted.sort(function(a,b){return b.reviews-a.reviews;});
  else if (mode==='price_asc') sorted.sort(function(a,b){return (a.price.paper||99999)-(b.price.paper||99999);});
  else if (mode==='price_desc') sorted.sort(function(a,b){return (b.price.paper||0)-(a.price.paper||0);});
  renderBookGrid(sorted);
}
function renderBookGrid(books){
  var grid = document.getElementById('book-grid');
  var cnt  = document.getElementById('books-count');
  currentBooks = books;
  cnt.innerHTML = '전체 <b>'+books.length+'</b>종';
  grid.innerHTML = books.map(function(b){
    var fmtBadges = b.formats.map(function(f){
      return '<span class="fmt-b '+f+'">'+FORMAT_INFO[f].label+'</span>';
    }).join('');
    var priceMin = Math.min.apply(null, Object.values(b.price));
    var statusTxt = b.status==='soon' ? '<span style="font-size:10.5px;color:var(--gold-soft);font-family:var(--mono)">출간 예정</span>' : '';
    return '<div class="bk-card" onclick="showDetail(\''+b.id+'\')">'
      +'<div class="bk-cover" style="background:'+b.coverColor+'">'
      +b.coverEmoji
      +'<div class="bk-format-badges">'+fmtBadges+'</div>'
      +'</div>'
      +'<div class="bk-body">'
      +'<div class="bk-cat">'+b.cat+'</div>'
      +'<div class="bk-title">'+b.title+'</div>'
      +'<div class="bk-author">'+b.authors.map(function(a){return a.name+' '+a.role;}).join(' · ')+'</div>'
      +(b.status==='available'
        ? '<div class="bk-price">₩'+priceMin.toLocaleString()+'~</div>'
        : '<div style="height:4px"></div>'+statusTxt)
      +'</div></div>';
  }).join('');
}

/* ══════ DETAIL ══════ */
function showDetail(id){
  var bk = BOOKS.find(function(b){return b.id===id;});
  if(!bk) return;
  state.currentBook = bk;
  state.currentFmt = bk.formats[0];

  document.getElementById('page-list').classList.remove('on');
  document.getElementById('page-detail').classList.add('on');
  document.getElementById('cat-bar').style.display = '';
  window.scrollTo(0,0);

  // 브레드크럼
  document.getElementById('bc-cat').textContent = bk.cat;
  document.getElementById('bc-title').textContent = bk.title.slice(0,20)+(bk.title.length>20?'…':'');

  // 표지
  var cover = document.getElementById('det-cover');
  cover.style.background = bk.coverColor;
  cover.textContent = bk.coverEmoji;

  // 형태 목록 (좌측)
  var fmtList = document.getElementById('det-format-list');
  fmtList.innerHTML = bk.formats.map(function(f){
    var fi = FORMAT_INFO[f];
    return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-mute);padding:4px 0">'
      +'<span>'+fi.ico+'</span><span>'+fi.label+'</span>'
      +(bk.price[f] ? '<span style="font-family:var(--mono);font-size:11.5px;margin-left:auto;color:var(--ink)">₩'+bk.price[f].toLocaleString()+'</span>' : '')
      +'</div>';
  }).join('');

  // 메타
  document.getElementById('det-cat').textContent = bk.cat;
  document.getElementById('det-title').textContent = bk.title;
  var authorHtml = bk.authors.map(function(a){return '<b>'+a.name+'</b> '+a.role;}).join(' · ');
  if(bk.translators.length) authorHtml += ' &nbsp;|&nbsp; '+bk.translators.map(function(t){return '<b>'+t.name+'</b> '+t.role;}).join(' · ');
  document.getElementById('det-author-row').innerHTML = authorHtml;
  var ratingEl = document.getElementById('det-rating');
  var reviewEl = document.getElementById('det-review-cnt');
  if(bk.rating){ ratingEl.textContent = bk.rating; reviewEl.textContent = '('+bk.reviews+'개 리뷰)'; }
  else { ratingEl.textContent = '—'; reviewEl.textContent = '(출간 전)'; }

  // 간략 정보
  document.getElementById('det-brief').innerHTML =
    '출판사: <b>에이콘출판사</b> &nbsp;|&nbsp; 출간: <b>'+bk.pub+'</b> &nbsp;|&nbsp; 페이지: <b>'+bk.pages+'p</b><br>'
    +'ISBN: <b>'+bk.isbn+'</b>';

  // 구매 박스
  renderBuyBox(bk, state.currentFmt);

  // 외부 채널
  var extHtml = '';
  if(bk.extChannels && bk.extChannels.length){
    extHtml = '<div class="external-channels"><div class="ext-title">다른 채널에서 구매</div><div class="ext-links">'
      + bk.extChannels.map(function(ch){
        var info = EXT_NAMES[ch];
        return '<a href="'+info.url+'" target="_blank" class="ext-link">'+info.name+' ↗</a>';
      }).join('') + '</div></div>';
  }
  document.getElementById('ext-channels').innerHTML = extHtml;

  // 탭 패널 리셋
  document.querySelectorAll('.dtab').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.dtab-panel').forEach(function(p){p.classList.remove('on');});
  document.querySelector('.dtab[data-dtab="intro"]').classList.add('on');
  document.getElementById('dtab-intro').classList.add('on');

  // 도서 소개
  document.getElementById('det-intro-body').innerHTML = bk.intro;

  // 저역자
  var authHtml = bk.authors.concat(bk.translators).map(function(a){
    var initials = a.name.slice(-2);
    return '<div class="author-card">'
      +'<div class="author-avatar">'+initials+'</div>'
      +'<div><div class="author-name">'+a.name+'</div>'
      +'<div class="author-role">'+a.role+'자</div>'
      +'<div class="author-bio">'+a.bio+'</div></div>'
      +'</div>';
  }).join('');
  document.getElementById('det-authors-body').innerHTML = authHtml;

  // 목차
  var tocHtml = bk.toc.map(function(part, pi){
    var chaps = part.chapters.map(function(c){
      return '<div class="toc-item"><span class="toc-ch">'+c.ch+'</span><span>'+c.title+'</span><span class="toc-pg">'+c.page+'p</span></div>';
    }).join('');
    return '<div class="toc-part">'
      +'<div class="toc-part-title"><span style="font-family:var(--mono);font-size:11px;color:var(--burgundy);margin-right:4px">'+(pi+1).toString().padStart(2,'0')+'</span>'+part.part+'</div>'
      +'<div class="toc-items">'+chaps+'</div>'
      +'</div>';
  }).join('');
  document.getElementById('det-toc-body').innerHTML = tocHtml;

  // 영상
  document.getElementById('det-video-meta').textContent = bk.title.slice(0,20)+' — 소개 영상 · 출간 후 공개';
  var vlistHtml = bk.videos.map(function(v){
    return '<div class="vcard" onclick="toast(\'출간 후 영상이 공개됩니다.\')">'
      +'<div class="vcard-thumb">▶</div>'
      +'<div><div class="vcard-title">'+v.title+'</div><div class="vcard-meta">'+v.duration+'</div></div>'
      +'</div>';
  }).join('');
  document.getElementById('det-video-list').innerHTML = vlistHtml;

  // 오류 신고
  var storedErr = JSON.parse(localStorage.getItem('acorn_err_'+bk.id)||'[]');
  var allErr = bk.errata.concat(storedErr);
  renderErrList(allErr);

  // Q&A
  var storedQA = JSON.parse(localStorage.getItem('acorn_qa_'+bk.id)||'[]');
  renderQAList(bk.qa.concat(storedQA));
}

function renderBuyBox(bk, fmt){
  state.currentFmt = fmt;
  // 형태 탭
  var tabsHtml = bk.formats.map(function(f){
    var fi = FORMAT_INFO[f];
    return '<button class="fmt-tab'+(f===fmt?' on':'')+(bk.status==='soon'?' disabled':'')+'" onclick="selectFmt(\''+f+'\')">'
      +'<span class="fmt-ico">'+fi.ico+'</span>'+fi.label+'</button>';
  }).join('');
  document.getElementById('format-tabs').innerHTML = tabsHtml;

  var price = bk.price[fmt];
  document.getElementById('det-price').textContent = price ? '₩'+price.toLocaleString() : '출간 예정';
  document.getElementById('det-price-orig').textContent = '';
  document.getElementById('det-price-dc').textContent = '';
  document.getElementById('det-price-desc').textContent = FORMAT_INFO[fmt].desc;

  // 수량은 종이책만
  document.getElementById('det-qty-row').style.display = fmt==='paper' ? 'flex' : 'none';
}
function selectFmt(fmt){
  renderBuyBox(state.currentBook, fmt);
}

function switchDTab(name, btn){
  document.querySelectorAll('.dtab').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.dtab-panel').forEach(function(p){p.classList.remove('on');});
  btn.classList.add('on');
  document.getElementById('dtab-'+name).classList.add('on');
}

/* ── 오류 신고 ── */
function renderErrList(items){
  var el = document.getElementById('err-list');
  if(!items.length){
    el.innerHTML = '<div style="padding:20px;text-align:center;font-size:12.5px;color:var(--ink-mute);background:var(--paper-light);border:1.5px dashed var(--rule);border-radius:8px">등록된 정오표가 없습니다.</div>';
    return;
  }
  el.innerHTML = items.map(function(it){
    var typeLabel = {fix:'정오표',note:'안내',update:'업데이트'}[it.type]||'정보';
    return '<div class="err-item">'
      +'<span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);white-space:nowrap;min-width:60px;padding-top:2px">'+(it.page||it.date||'')+'</span>'
      +'<span class="err-type-badge '+(it.type==='fix'?'fix':'note')+'">'+typeLabel+'</span>'
      +'<div style="flex:1;font-size:13px;color:var(--ink-soft)">'+it.content+'</div>'
      +'</div>';
  }).join('');
}
function submitErr(){
  var bk = state.currentBook;
  var type = document.getElementById('err-type').value.trim();
  var page = document.getElementById('err-page').value.trim();
  var orig = document.getElementById('err-orig').value.trim();
  var fix  = document.getElementById('err-fix').value.trim();
  if(!orig||!fix){ toast('⚠ 원문과 수정안을 입력해주세요.'); return; }
  var today = new Date(); var ds = today.getFullYear()+'.'+(today.getMonth()+1).toString().padStart(2,'0')+'.'+today.getDate().toString().padStart(2,'0');
  var stored = JSON.parse(localStorage.getItem('acorn_err_'+bk.id)||'[]');
  stored.push({type:'note',date:ds,page:page,content:(type?'['+type+'] ':'')+orig+' → '+fix});
  localStorage.setItem('acorn_err_'+bk.id, JSON.stringify(stored));
  ['err-type','err-page','err-orig','err-fix'].forEach(function(id){document.getElementById(id).value='';});
  renderErrList(bk.errata.concat(stored));
  toast('✓ 오류 신고가 접수되었습니다.');
}

/* ── 독자 문의 ── */
function renderQAList(items){
  var el = document.getElementById('qa-list');
  if(!items.length){
    el.innerHTML = '<div style="padding:20px;text-align:center;font-size:12.5px;color:var(--ink-mute);background:var(--paper-light);border:1.5px dashed var(--rule);border-radius:8px">등록된 문의가 없습니다.</div>';
    return;
  }
  el.innerHTML = items.map(function(it){
    return '<div class="qa-item">'
      +'<div class="qa-q">'+it.q+'</div>'
      +(it.a ? '<div class="qa-a">'+it.a+'</div>' : '<div style="font-size:11px;color:var(--ink-mute);margin-top:6px;font-family:var(--mono)">답변 대기 중</div>')
      +'<div class="qa-meta">'+(it.date||'')+(it.author?' · '+it.author:'')+'</div>'
      +'</div>';
  }).join('');
}
function submitQA(){
  var bk = state.currentBook;
  var name = (document.getElementById('qa-name').value||'').trim()||'익명 독자';
  var q = document.getElementById('qa-q').value.trim();
  if(!q){ toast('⚠ 문의 내용을 입력해주세요.'); return; }
  var today = new Date(); var ds = today.getFullYear()+'.'+(today.getMonth()+1).toString().padStart(2,'0')+'.'+today.getDate().toString().padStart(2,'0');
  var stored = JSON.parse(localStorage.getItem('acorn_qa_'+bk.id)||'[]');
  stored.unshift({q:q, a:'', date:ds, author:name});
  localStorage.setItem('acorn_qa_'+bk.id, JSON.stringify(stored));
  document.getElementById('qa-name').value=''; document.getElementById('qa-q').value='';
  renderQAList(bk.qa.concat(stored));
  toast('✓ 문의가 접수되었습니다. 7영업일 이내 답변드립니다.');
}

/* ── 토스트 ── */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){t.classList.remove('on');}, 2800);
}

/* ── 헤더 로그인 상태 ── */
function handleHeaderLogin(e){
  var user = ACORN_DB.getUser();
  if(user){
    e.preventDefault();
    window.location.href = 'mypage.html';
  }
}
function updateHeaderUser(){
  var user = ACORN_DB.getUser();
  var btn = document.getElementById('hd-login-btn');
  if(!btn) return;
  if(user){
    var initial = user.name ? user.name.slice(0,1) : '독';
    btn.querySelector('.hd-login-avatar').style.background = 'var(--gold)';
    btn.querySelector('.hd-login-avatar').style.color = 'var(--burgundy-deep)';
    btn.querySelector('.hd-login-avatar').textContent = initial;
    btn.querySelector('.hd-login-label').textContent = (user.name||'내 서재') + ' ▾';
  }
}

/* ── 관리자 등록 도서 병합 ── */
(function mergeAdminBooks(){
  var adminBooks = ACORN_DB.getBooks();
  if(!adminBooks.length) return;
  adminBooks.forEach(function(ab){
    var exists = BOOKS.find(function(b){ return b.id === String(ab.id) || b.id === 'bm'+ab.id; });
    if(!exists){
      var formats = [];
      var rawPrice = parseInt((String(ab.price||'0')).replace(/,/g,''))||0;
      var rawEbook = parseInt((String(ab.ebook||'0')).replace(/,/g,''))||0;
      if(rawPrice) formats.push('paper');
      if(rawEbook) formats.push('ebook');
      BOOKS.push({
        id:'bm'+ab.id, cat:ab.cat||'기타', title:ab.title, subtitle:ab.sub||'',
        authors:[{name:ab.auth||ab.aname||'', role:'저', bio:ab.abio||''}], translators:[],
        coverColor:'linear-gradient(135deg,var(--burgundy),var(--burgundy-deep))',
        coverEmoji:'\uD83D\uDCDA',
        price:{paper:rawPrice, ebook:rawEbook},
        formats:formats.length?formats:['paper'], pages:ab.pages||0, pub:ab.pub||'',
        isbn:ab.isbn||'', status:ab.status==='active'?'available':'soon',
        rating:0, reviews:0, intro:'<p>'+ab.title+'</p>', toc:[], errata:[], qa:[], videos:[],
        extChannels:['kyobo','yes24','aladin','ridi'],
      });
    }
  });
})();

/* ── 초기화 ── */
(function init(){
  currentBooks = BOOKS.slice();
  renderBookGrid(BOOKS);
  updateCartBadge();
  updateHeaderUser();
  // 대기 중인 결제 처리
  if(localStorage.getItem('acorn_pending_checkout')==='1' && ACORN_DB.isLoggedIn()){
    localStorage.removeItem('acorn_pending_checkout');
    if(state.cart.length) setTimeout(function(){ toggleCart(); toast('로그인 완료! 결제를 진행해주세요.'); }, 600);
  }
})();
</script>
